# variables:
# VERSION: the VoyantServer release number (for prod service)
# BRANCH: the branch (master or dev) to use (for dev service)
# MEMORY: the amount of GBs of memory to allocate
# LOCALDIR: the name of the local dir to use as Voyant's data dir
#
# example:
# LOCALDIR=/mnt/d/VoyantData MEMORY=8 docker compose up local -d
services:
  prod:
    build:
      args:
        VERSION: ${VERSION:-2.6.23}
      context: ./prod
    restart: always
    healthcheck: &healthcheck
      test: ["CMD-SHELL", "curl -fI -H 'Connection: keep-alive' http://localhost:8080/resources/ext/6.2.0/charts-all.css || exit 1"]
      start_period: 300s
      interval: 30s
      timeout: 10s
      retries: 3
    ports: &ports
      - 8080:8080
      - 4000:4000
    environment:
      CATALINA_TMPDIR: /voyant-data
      CATALINA_OPTS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=75.0
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/voyant-data/heapdump.hprof
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -Dorg.voyanttools.server.storage=file-per-corpus
        -Dorg.voyanttools.server.showservermessage=true
        -javaagent:/glowroot/glowroot.jar
        -Dglowroot.data.dir=/voyant-data/glowroot-data
    deploy:
      resources:
        limits:
          memory: "${MEMORY:-45}g"
    volumes:
      - ${LOCALDIR:-/voyant-data}/:/voyant-data
    labels:
      - autoheal=true
  dev:
    build:
      args:
        BRANCH: ${BRANCH:-dev}
      context: ./dev
    restart: always
    healthcheck: *healthcheck
    ports: *ports
    environment:
      CATALINA_TMPDIR: /voyant-data
      CATALINA_OPTS: >-
        -Xms${JAVA_MEMORY:-8}g
        -Xmx${JAVA_MEMORY:-8}g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:MetaspaceSize=256m
        -XX:MaxMetaspaceSize=1g
        -XX:NativeMemoryTracking=detail
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/voyant-data/heapdump.hprof
        -Xlog:gc*:file=/usr/local/tomcat/logs/gc.log:time:filecount=5,filesize=10M
        -Duser.timezone=America/Edmonton
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -Dorg.voyanttools.server.storage=file-per-corpus
        -Dorg.voyanttools.server.showservermessage=true
        -javaagent:/glowroot/glowroot.jar
        -Dglowroot.data.dir=/voyant-data/glowroot-data
    deploy:
      resources:
        limits:
          memory: "${MEMORY:-10}g"
    volumes:
      - ${LOCALDIR:-/voyant-data}/:/voyant-data
      - ${LOCALDIR:-/voyant-data}/tomcat-logs:/usr/local/tomcat/logs
    labels:
      - autoheal=true

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    user: root
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
